
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Blood Test Risk Tracker{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="{{ url_for('static', path='/style.css') }}"
        rel="stylesheet"
    >
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                Blood Test Risk Tracker
            </a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link" href="/patients/new">Add Patient</a>
                <a class="nav-link" href="/rejected">Rejected Submissions</a>
                <a class="nav-link" href="/docs">API Docs</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% if message %}
            <div class="alert alert-success alert-dismissible fade show">
                {{ message }}
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                ></button>
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <!-- <footer class="text-center py-4 mt-5 border-top">
        <small class="text-muted">
            Educational risk indication only — not a medical diagnosis.
        </small>
    </footer> -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
</body>
</html>
